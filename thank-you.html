<!-- ==========================================
     WILDROOT PURCHASE CONVERSION
     Value comes from the Stripe redirect URL (?sku=&value=&session_id=),
     falling back to what the product page stashed before handoff.
     No value => no purchase fired (direct / bookmarked hits stay clean).
     ========================================== -->
<script>
(function(){
  var CATALOG = {
    tripleshot: { name: '1SHOT TRIPLESHOT',     value: 75.00 },
    vip:        { name: 'Destructive Tower VIP', value: 68.00 }
  };

  var qs    = new URLSearchParams(window.location.search);
  var sku   = qs.get('sku');
  var value = parseFloat(qs.get('value'));
  var txId  = qs.get('session_id') || qs.get('transaction_id');
  var name  = null;

  /* Fallback: stashed by wrCheckout() on the product page. */
  if (!sku || !(value > 0)) {
    try {
      var pending = JSON.parse(sessionStorage.getItem('wr_pending_purchase') || 'null');
      if (pending && pending.value > 0) {
        sku  = sku || pending.sku;
        name = pending.name;
        if (!(value > 0)) value = pending.value;
        if (!txId) txId = 'wr_' + pending.t;
      }
    } catch(e){}
  }
  if (sku && CATALOG[sku]) {
    if (!name)          name  = CATALOG[sku].name;
    if (!(value > 0))   value = CATALOG[sku].value;
  }

  /* GUARD 1 — no purchase context at all: someone just opened /thank-you. */
  if (!(value > 0)) return;

  /* GUARD 2 — dedupe refresh / back-nav / re-open. localStorage so a reopened
     tab does not double-count the same order. */
  if (!txId) txId = 'wr_' + (sku || 'unknown') + '_' + value;
  var key = 'wr_purchase_sent_' + txId;
  try {
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
  } catch(e){}
  try { sessionStorage.removeItem('wr_pending_purchase'); } catch(e){}

  fbq('track', 'Purchase', {
    content_ids:  sku ? [sku] : [],
    content_type: 'product',
    content_name: name || sku || '',
    value:        value,
    currency:     'USD',
    num_items:    1
  }, { eventID: txId });

  gtag('event', 'purchase', {
    transaction_id: txId,
    value:          value,
    currency:       'USD',
    items: [{ item_id: sku || 'unknown', item_name: name || sku || '', price: value, quantity: 1 }]
  });
})();
</script>
